name: Validate Audio Tools Cloudflare Worker

on:
  pull_request:
    paths:
      - "worker.js"
      - "wrangler.jsonc"
      - "cloudflare/schema.sql"
      - "cloudflare/migrations/*.sql"
  push:
    branches:
      - "main"
      - "paypal-sandbox"
    paths:
      - "worker.js"
      - "wrangler.jsonc"
      - "cloudflare/schema.sql"
      - "cloudflare/migrations/*.sql"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Check Worker syntax
        run: node --check worker.js

      - name: Check Wrangler configuration
        run: |
          npx --yes wrangler deploy --dry-run --outdir=./.wrangler-dry-run
          
      - name: Check D1 schema
        run: |
          test -s cloudflare/schema.sql
          test -s cloudflare/migrations/003_remove_support_requests.sql
          grep -q "DROP TABLE IF EXISTS support_requests" cloudflare/migrations/003_remove_support_requests.sql
          grep -q "CREATE TABLE plans" cloudflare/schema.sql
          grep -q "CREATE TABLE entitlements" cloudflare/schema.sql
          grep -q "CREATE TABLE paypal_subscriptions" cloudflare/schema.sql
          ! grep -q "support_requests" cloudflare/schema.sql
          ! grep -q "RESEND" worker.js
          ! grep -q "resend" worker.js
          ! grep -q "/api/support/contact" worker.js
          ! grep -q "sendSupportContact" worker.js
          ! grep -q "SUPPORT_TO_EMAIL" wrangler.jsonc
          ! grep -q "RESEND_API_KEY" wrangler.jsonc
          ! grep -q "RESEND_FROM_EMAIL" wrangler.jsonc
          ! grep -q "paypal_orders" cloudflare/schema.sql
          ! grep -q "credit_accounts" cloudflare/schema.sql
          ! grep -q "credit_transactions" cloudflare/schema.sql
          ! grep -q "tool_usage" cloudflare/schema.sql
