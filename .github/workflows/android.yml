name: Android Build and Release

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: audio-tools-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.7.1"

      - name: Configure optional release signing
        if: github.event_name != 'pull_request'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$ANDROID_KEYSTORE_BASE64" && \
                -n "$ANDROID_KEYSTORE_PASSWORD" && \
                -n "$ANDROID_KEY_ALIAS" && \
                -n "$ANDROID_KEY_PASSWORD" ]]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > audio-tools-release.jks
            chmod 600 audio-tools-release.jks
            keytool -list \
              -keystore audio-tools-release.jks \
              -storepass "$ANDROID_KEYSTORE_PASSWORD" \
              -alias "$ANDROID_KEY_ALIAS" >/dev/null
            printf '%s\n' \
              "storeFile=$GITHUB_WORKSPACE/audio-tools-release.jks" \
              "storePassword=$ANDROID_KEYSTORE_PASSWORD" \
              "keyAlias=$ANDROID_KEY_ALIAS" \
              "keyPassword=$ANDROID_KEY_PASSWORD" \
              > keystore.properties
            chmod 600 keystore.properties
            echo "Custom release signing configured."
          else
            echo "Release signing secrets are required for installable releases."
            exit 1
          fi
      - name: Build installable debug APK
        if: github.event_name == 'pull_request'
        run: gradle assembleDebug --stacktrace

      - name: Build installable release APK
        if: github.event_name != 'pull_request'
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle assembleRelease --stacktrace


      - name: Print APK signing certificate
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$apksigner"
          "$apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk | tee APK_CERTIFICATE.txt
          grep -F             "21e07ed4d7de65af3db2d1094b65ed2ec87064dc128f2b82d4bf3bb32e9d9eab"             APK_CERTIFICATE.txt >/dev/null

      - name: Upload APK artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: audio-tools-release
          path: |
            app/build/outputs/apk/release/app-release.apk
            APK_CERTIFICATE.txt
          if-no-files-found: error

      - name: Prepare release tag
        id: release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          version=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)
          test -n "$version"
          tag="v$version"
          echo "tag_name=$tag" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "Tag $tag already exists."
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "Tag $tag does not exist; it will be created from $GITHUB_SHA."
          fi

      - name: Create GitHub Release
        if: steps.release.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release.outputs.tag_name }}
          target_commitish: ${{ github.sha }}
          name: Audio Tools ${{ steps.release.outputs.tag_name }}
          files: app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
